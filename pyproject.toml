[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egolens"
version = "0.1.0"
description = "An interactive, evidence-grounded egocentric video memory assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
egolens = "egolens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
